# ============================================================
# Publication du site sur GitHub Pages
# ------------------------------------------------------------
# À chaque arrivée de code sur main (fusion d'une pull request) :
# tests -> compilation -> publication sur https://<compte>.github.io/<dépôt>/
# Lancement à la main : onglet Actions -> « Publication du site » -> Run workflow.
#
# Réglage du dépôt (Settings -> Secrets and variables -> Actions -> Variables) :
#   VITE_API_URL           adresse de l'API (ex. https://nanjaraio.alwaysdata.net/api)
#   VITE_GOOGLE_CLIENT_ID  facultatif : identifiant du bouton Google (sinon celui du code)
# Ce ne sont pas des secrets : ces valeurs finissent dans le JavaScript du site.
# ============================================================
name: Publication du site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits minimaux : lire le code, publier sur Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; celle en cours va jusqu'au bout
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Tests des calculs (vitest)
        run: npm test

      - name: Compilation
        run: npm run build
        env:
          # Le site vit sous /<dépôt>/ (ex. /BTM/) : chemins des fichiers et du routeur
          BASE_PATH: /${{ github.event.repository.name }}/
          # Version de démonstration : le site complet, avec le repère « Develop »
          BTM_ENVIRONNEMENT: develop
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      # GitHub Pages ne connaît pas les adresses du routeur (/BTM/fournisseurs…) : sa page 404
      # est le site lui-même, qui affiche la bonne page. .nojekyll : fichiers servis tels quels.
      - name: Page 404 du routeur
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
