# Configuration Supabase CLI — BTM
project_id = "btm-mayotte"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://btm-mayotte.vercel.app"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.estimation]
verify_jwt = false

[functions.supprimer-compte]
verify_jwt = true

[functions.admin-utilisateurs]
verify_jwt = true

[functions.boite-mail]
verify_jwt = true
